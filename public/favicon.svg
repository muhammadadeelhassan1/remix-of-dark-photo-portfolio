<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="50%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#18181B" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E4E4E7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Rounded Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Monogram MN -->
  <g fill="url(#textGrad)" style="font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; font-weight: 900; letter-spacing: -2px;">
    <!-- Geometric stylized M and N -->
    <path d="M 110 350 L 110 162 L 160 162 L 208 266 L 256 162 L 306 162 L 306 350 L 264 350 L 264 220 L 222 312 L 194 312 L 152 220 L 152 350 Z" />
    <path d="M 334 350 L 334 162 L 380 162 L 442 284 L 442 162 L 480 162 L 480 350 L 436 350 L 372 224 L 372 350 Z" transform="translate(-40, 0)" />
  </g>

  <!-- Cyan/Emerald Digital Spark Accent on N -->
  <circle cx="440" cy="155" r="14" fill="#38BDF8" filter="url(#glow)" />
</svg>
